name: Quality

on:
  push:
    branches:
      - main
      - "revival/**"
      - "hotfix/**"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify dependency graph
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q bot.py main.py cogs core cytechlink utils web

  web-syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check browser scripts
        run: |
          node --check web/script.js
          node --check web/settings.js
          node --check web/security-bootstrap.js

      - name: Check Cloudflare Pages modules
        run: |
          node --input-type=module --check < web/functions/_middleware.js
          node --input-type=module --check < web/functions/api/proxy.js
          node --input-type=module --check < web/functions/api/gateway.js
          node --input-type=module --check < web/functions/api/recommended.js

  security-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit tooling
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt --desc
