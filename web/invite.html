<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invite - Cytech Music</title>
    <link rel="icon" href="logo-circle.png" type="image/png">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="flex-center-screen">
    <div class="bg-gradient"></div>
    <div class="loader"></div>
    <div id="status" class="status-desc" style="font-size: 1.2rem;">Preparing invite...</div>

    <script>
        function setStatus(text) {
            document.getElementById('status').textContent = text;
        }

        async function redirectToBotInvite() {
            try {
                const response = await fetch('/api/proxy?action=runtime_config', { cache: 'no-store' });
                if (!response.ok) throw new Error(`Runtime config HTTP ${response.status}`);
                const runtime = await response.json();
                const clientId = String(runtime.client_id || '');
                if (!/^\d{15,22}$/.test(clientId)) {
                    throw new Error('Discord Client ID is not configured for this deployment');
                }

                const inviteUrl = new URL('https://discord.com/api/oauth2/authorize');
                inviteUrl.searchParams.set('client_id', clientId);
                inviteUrl.searchParams.set('permissions', '3533896');
                inviteUrl.searchParams.set('scope', 'bot applications.commands');

                setStatus('Redirecting to Discord...');
                window.location.replace(inviteUrl.toString());
            } catch (error) {
                console.error('[Invite] Configuration error:', error);
                document.querySelector('.loader').style.display = 'none';
                setStatus(`Invite unavailable: ${error.message}`);
            }
        }

        // Community edition never requests guilds.join and never auto-joins a maintainer-owned server.
        redirectToBotInvite();
    </script>
</body>

</html>
